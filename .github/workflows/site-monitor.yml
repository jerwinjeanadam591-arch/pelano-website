name: Live site monitor

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check homepage availability
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 https://pelanoresources.co.tz/ --output /dev/null
      - name: Check sitemap availability
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 https://pelanoresources.co.tz/sitemap.xml --output /dev/null
      - name: Crawl live sitemap pages and internal links
        env:
          PELANO_SITE_URL: https://pelanoresources.co.tz
        run: node scripts/check-live-links.cjs
