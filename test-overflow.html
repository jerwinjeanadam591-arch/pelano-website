<!DOCTYPE html>
<html>
<head>
    <title>Overflow Detection Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<pre id="output" style="white-space: pre-wrap; word-wrap: break-word; padding: 20px; background: #f5f5f5;"></pre>
<script>
const output = document.getElementById('output');
let html = 'OVERFLOW DETECTION TEST\n\n';
html += 'Viewport: ' + window.innerWidth + 'px wide\n\n';

// Find all elements with overflow
const overflowElements = [];
document.querySelectorAll('*').forEach((el, idx) => {
  if (el.scrollWidth > el.clientWidth) {
    overflowElements.push({
      el: el,
      tag: el.tagName,
      class: el.className,
      id: el.id,
      scrollWidth: el.scrollWidth,
      clientWidth: el.clientWidth,
      overflow: el.scrollWidth - el.clientWidth,
      computed: window.getComputedStyle(el).overflow
    });
  }
});

if (overflowElements.length === 0) {
  html += '✓ No overflow elements detected!\n';
} else {
  html += `Found ${overflowElements.length} element(s) with overflow:\n\n`;
  overflowElements.forEach((item, idx) => {
    html += `[${idx + 1}] <${item.tag}>\n`;
    if (item.id) html += `    ID: ${item.id}\n`;
    if (item.class) html += `    Class: ${item.class}\n`;
    html += `    ScrollWidth: ${item.scrollWidth}px\n`;
    html += `    ClientWidth: ${item.clientWidth}px\n`;
    html += `    Overflow: ${item.overflow}px\n`;
    html += `    CSS overflow: ${item.computed}\n\n`;
  });
}

output.textContent = html;
</script>
</body>
</html>
